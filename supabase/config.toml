# Puertos locales 1542x: evitan las reservas dinámicas TCP de Windows (49152–65535).
project_id = "daily-tracker"

[api]
enabled = true
port = 15421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 15422
shadow_port = 15420
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 15423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 15424

[storage]
enabled = false

[auth]
enabled = true
site_url = "dailytracker://callback"
additional_redirect_urls = ["dailytracker://callback", "dailytracker://callback?mode=recovery"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
